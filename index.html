<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignments</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #100d20;
            color: #f5f0ff;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 35px 15px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #30204f, #17132b);
            border: 1px solid #7553a8;
            border-radius: 20px;
        }

        header h1 {
            font-size: 30px;
            color: #d9b8ff;
            margin-bottom: 12px;
        }

        header p {
            color: #d0c5e5;
            line-height: 1.6;
        }

        .card {
            background: #1b1730;
            border: 1px solid #41325e;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #d9b8ff;
            font-size: 21px;
            margin-bottom: 12px;
        }

        .card p {
            color: #c9bfdc;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #a56bff, #7540c8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px #a56bff55;
        }

        .output-card {
            background: #090b13;
            border: 1px solid #7553a8;
            border-radius: 16px;
            padding: 22px;
            margin-top: 25px;
        }

        .output-card h2 {
            color: #bfa0ff;
            margin-bottom: 15px;
        }
